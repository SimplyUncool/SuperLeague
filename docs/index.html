<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="Super League — competitive football on Roblox.">
<title>Super League</title>
<style>
:root{--bg:#080808;--text:#fff;--muted:#d0d0d0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
.hero{position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden}
.banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.28),rgba(0,0,0,.58));pointer-events:none}
.nav{position:absolute;z-index:2;top:0;left:0;width:100%;height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 42px}
.brand{font-size:18px;font-weight:900;letter-spacing:-.04em}
.links{display:flex;gap:26px;font-weight:650}
.links a{opacity:.9}.links a:hover{opacity:1}
.hero-copy{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1100px,calc(100% - 40px));text-align:center}
.kicker{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}
h1{margin:0;font-size:clamp(3.5rem,9vw,8rem);line-height:.9;letter-spacing:-.075em}
h1 span{display:inline-block;min-width:6ch}
.roblox-mark{display:inline-block;width:.72em;height:.72em;margin-left:.12em;vertical-align:-.03em;transform:rotate(14deg);fill:currentColor}
.lead{max-width:620px;margin:25px auto 0;color:var(--muted);font-size:17px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.btn{padding:12px 19px;border:1px solid rgba(255,255,255,.55);font-weight:750;background:rgba(0,0,0,.2)}
.btn.primary{background:#fff;color:#080808;border-color:#fff}
.btn:hover{transform:translateY(-1px)}
@media(max-width:650px){.nav{height:68px;padding:0 18px}.links{gap:15px}.hero{min-height:520px}h1{font-size:clamp(3rem,15vw,5.5rem)}.lead{font-size:15px}}
</style>
</head>
<body>
<section class="hero">
<img class="banner" src="SLBANNER.png" alt="Super League">
<nav class="nav">
<a class="brand" href="index.html">SUPER LEAGUE</a>
<div class="links"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a></div>
</nav>
<div class="hero-copy">
<div class="kicker">Super League</div>
<h1>The best league<br>for <span id="rotating">casuals</span><br>on <svg class="roblox-mark" viewBox="0 0 100 100" role="img" aria-label="Roblox"><path d="M17 17 83 4l13 66-66 13zM43 36l21-4 4 21-21 4z"/></svg></h1>
<p class="lead">A competitive football league built for players, teams and communities on Roblox.</p>
<div class="actions">
<a class="btn primary" href="terms.html">League terms</a>
<a class="btn" href="privacy.html">Privacy policy</a>
</div>
</div>
</section>
<script>
const phrases=["casuals","pros","legends"];
let index=0;
const rotating=document.getElementById("rotating");
setInterval(()=>{index=(index+1)%phrases.length;rotating.textContent=phrases[index]},2200);
</script>
</body>
</html>
