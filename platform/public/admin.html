<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super League Admin</title><style>:root{--bg:#080808;--panel:#121212;--line:#292929;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.6 Inter,system-ui,sans-serif}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:70px 0}.eyebrow{color:#aaa;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800}.brand{font-size:24px;font-weight:900;margin:8px 0 50px}h1{font-size:clamp(3rem,8vw,6rem);line-height:.9;letter-spacing:-.07em;margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:20px}.num{font-size:32px;font-weight:900}.muted{color:#888}.error{color:#c88;margin-top:20px}</style></head><body><main><div class="eyebrow">Restricted interface</div><div class="brand">SUPER LEAGUE ADMIN</div><h1>Control center.</h1><div class="grid" id="grid"><div class="card">Loading…</div></div><div class="error" id="error"></div></main><script>fetch('/api/v1/admin/summary').then(r=>r.ok?r.json():Promise.reject()).then(s=>{const labels=[['teams','Teams'],['applications','Applications'],['matches','Matches'],['auditEvents','Audit events']];document.getElementById('grid').innerHTML=labels.map(([k,l])=>`<div class="card"><div class="num">${Number(s[k]||0)}</div><div class="muted">${l}</div></div>`).join('')}).catch(()=>document.getElementById('error').textContent='Could not load admin data.');</script></body></html>
