<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super League Logs</title><style>:root{--bg:#080808;--panel:#101010;--line:#292929;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.6 Inter,system-ui,sans-serif}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:70px 0}.eyebrow{color:#aaa;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800}.brand{font-size:24px;font-weight:900;margin:8px 0 50px}h1{font-size:clamp(3rem,8vw,6rem);line-height:.9;letter-spacing:-.07em;margin:0 0 24px}.log{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);font:13px/1.5 ui-monospace,monospace}.row{padding:14px 16px;border-bottom:1px solid var(--line);white-space:pre-wrap}.row:last-child{border:0}.muted{color:#777}.error{color:#c88;margin-top:18px}</style></head><body><main><div class="eyebrow">Restricted interface</div><div class="brand">SUPER LEAGUE LOGS</div><h1>Audit trail.</h1><div class="log" id="log"><div class="row muted">Loading…</div></div><div class="error" id="error"></div></main><script>fetch('/api/v1/admin/logs').then(r=>r.ok?r.json():Promise.reject()).then(j=>{const rows=j.data||[];document.getElementById('log').innerHTML=rows.length?rows.map(x=>`<div class="row">${JSON.stringify(x)}</div>`).join(''):'<div class="row muted">No audit events yet.</div>'}).catch(()=>document.getElementById('error').textContent='Could not load audit logs.');</script></body></html>
