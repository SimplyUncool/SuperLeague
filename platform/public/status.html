<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super League Status</title><style>:root{--bg:#080808;--panel:#121212;--line:#292929;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.6 Inter,system-ui,sans-serif}main{width:min(1000px,calc(100% - 32px));margin:auto;padding:80px 0}.eyebrow{color:#aaa;text-transform:uppercase;letter-spacing:.16em;font-weight:800;font-size:12px}.brand{font-size:24px;font-weight:900;margin:8px 0 48px}h1{font-size:clamp(3rem,8vw,6rem);line-height:.9;letter-spacing:-.07em;margin:0 0 18px}.sub{color:#bbb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:42px}.card{border:1px solid var(--line);background:var(--panel);padding:22px;border-radius:16px}.row{display:flex;justify-content:space-between;gap:20px}.ok{color:#fff}.bad{color:#c88}.unknown{color:#777}.lat{display:block;color:#777;font:12px ui-monospace,monospace;margin-top:8px}.foot{margin-top:30px;color:#777;font-size:13px}</style></head><body><main><div class="eyebrow">Super League infrastructure</div><div class="brand">SUPER LEAGUE</div><h1>System status.</h1><p class="sub">Live checks for the Super League platform and its connected services.</p><section class="grid" id="grid"><div class="card">Checking…</div></section><div class="foot" id="updated"></div></main><script>fetch('/status.json').then(r=>r.json()).then(s=>{document.getElementById('grid').innerHTML=Object.entries(s.services).map(([k,v])=>`<div class="card"><div class="row"><strong>${k}</strong><span class="${v.ok?'ok':v.configured?'bad':'unknown'}">${v.ok?'Operational':v.configured?'Degraded':'Not wired'}</span></div><span class="lat">${v.latencyMs==null?'':v.latencyMs+' ms'}</span></div>`).join('');document.getElementById('updated').textContent='Last checked '+new Date(s.generatedAt).toLocaleString()}).catch(()=>document.getElementById('grid').innerHTML='<div class="card bad">Status data unavailable.</div>');</script></body></html>
