<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super League Applications</title><style>:root{--bg:#080808;--panel:#121212;--line:#292929;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.6 Inter,system-ui,sans-serif}main{width:min(850px,calc(100% - 32px));margin:auto;padding:70px 0}.eyebrow{color:#aaa;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800}.brand{font-size:24px;font-weight:900;margin:8px 0 48px}h1{font-size:clamp(3rem,8vw,6rem);line-height:.9;letter-spacing:-.07em;margin:0 0 18px}.lead{color:#bbb}.card{margin-top:32px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;color:#aaa;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #333;background:#090909;color:#fff;border-radius:10px;padding:12px;font:inherit}textarea{min-height:120px;resize:vertical}.full{grid-column:1/-1}button{border:0;border-radius:10px;background:#fff;color:#000;padding:12px 18px;font-weight:900;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.msg{margin-top:14px;color:#aaa}.ok{color:#fff}.err{color:#c88}</style></head><body><main><div class="eyebrow">Super League</div><div class="brand">APPLICATIONS</div><h1>Join the league.</h1><p class="lead">Submit a player, team, staff or manager application. Identity fields are optional until an authenticated identity provider is connected.</p><form class="card" id="form"><div class="grid"><div><label>Application type</label><select name="type" required><option value="player">Player</option><option value="team">Team</option><option value="staff">Staff</option><option value="manager">Manager</option></select></div><div><label>Name</label><input name="name" maxlength="100" required></div><div><label>Discord ID</label><input name="discordId" inputmode="numeric" maxlength="32" placeholder="Optional"></div><div><label>Roblox ID</label><input name="robloxId" inputmode="numeric" maxlength="32" placeholder="Optional"></div><div class="full"><label>Application</label><textarea name="application" maxlength="2000" required placeholder="Tell the league what you are applying for and why."></textarea></div><div style="display:none"><label>Website</label><input name="website" tabindex="-1" autocomplete="off"></div><div class="full"><button id="submit">Submit application</button><div class="msg" id="msg"></div></div></div></form></main><script>const f=document.getElementById('form'),b=document.getElementById('submit'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;m.textContent='Submitting…';m.className='msg';const fd=new FormData(f);const payload={type:fd.get('type'),name:fd.get('name'),discordId:fd.get('discordId'),robloxId:fd.get('robloxId'),website:fd.get('website'),answers:{application:fd.get('application')}};try{const r=await fetch('https://api.superleague.site/api/v1/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Submission failed');m.textContent=`Application submitted. Reference: ${j.id}`;m.className='msg ok';f.reset()}catch(err){m.textContent=err.message||'Submission failed';m.className='msg err'}finally{b.disabled=false}});</script></body></html>
