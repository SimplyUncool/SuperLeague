name: Deploy Discord Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            BOT_DIR="/home/opc/sl-bot"
            cd "$BOT_DIR"

            DB_DIR="/home/opc/sl-bot-data"
            DB_FILE="$DB_DIR/superleague.db"
            BACKUP_DIR="$DB_DIR/backups"
            LEGACY_DB="$DB_DIR/users.json"
            mkdir -p "$BACKUP_DIR"

            if [ ! -f "$LEGACY_DB" ] && [ -f "$BOT_DIR/bot/users.json" ]; then
              cp "$BOT_DIR/bot/users.json" "$LEGACY_DB"
            fi

            for legacy in users.json users.json.bak levels.json invites.json tickets.json security.json; do
              if [ -f "$DB_DIR/$legacy" ]; then
                cp "$DB_DIR/$legacy" "$BACKUP_DIR/$legacy-$(date +%Y%m%d-%H%M%S)"
              fi
            done

            git fetch origin main
            git reset --hard origin/main

            cd "$BOT_DIR/bot"
            npm install --omit=dev
            find . -type f -name '*.js' ! -name 'applications_legacy.js' -exec node --check {} \;

            cd "$BOT_DIR"
            if [ -f "$DB_FILE" ]; then
              DB_FILE="$DB_FILE" node -e 'const Database=require("better-sqlite3"); const db=new Database(process.env.DB_FILE); db.pragma("wal_checkpoint(TRUNCATE)"); db.close();'
              cp "$DB_FILE" "$BACKUP_DIR/superleague-$(date +%Y%m%d-%H%M%S).db"
            fi

            SUPER_LEAGUE_DB_PATH="$DB_FILE" pm2 restart discord-bot --update-env
            pm2 describe discord-bot >/dev/null

            ls -1t "$BACKUP_DIR"/superleague-*.db 2>/dev/null | tail -n +21 | xargs -r rm -f
