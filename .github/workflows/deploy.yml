name: Deploy Discord Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e

            cd ~/discord-bot

            DB_DIR="$HOME/discord-bot-data"
            DB_FILE="$DB_DIR/users.json"
            BACKUP_DIR="$DB_DIR/backups"

            mkdir -p "$BACKUP_DIR"

            # Migrate the live database out of the Git working tree exactly once.
            # This runs before the repository is reset so uncommitted runtime data
            # cannot be lost by the deployment.
            if [ ! -f "$DB_FILE" ] && [ -f "$HOME/discord-bot/users.json" ]; then
              cp "$HOME/discord-bot/users.json" "$DB_FILE"
            fi

            # Keep a deployment-time recovery copy of the live database.
            if [ -f "$DB_FILE" ]; then
              cp "$DB_FILE" "$BACKUP_DIR/users-$(date +%Y%m%d-%H%M%S).json"
            fi

            # Keep the server checkout exactly aligned with origin/main.
            # Runtime state is no longer stored in this working tree.
            git fetch origin main
            git reset --hard origin/main

            cd ~/discord-bot/bot
            npm ci

            # Syntax-check every JavaScript file before touching the live process.
            find . -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
              node --check "$file"
            done

            cd ~/discord-bot
            SUPER_LEAGUE_DB_PATH="$DB_FILE" pm2 restart discord-bot --update-env
            pm2 describe discord-bot >/dev/null

            # Keep only the newest 20 deployment backups.
            ls -1t "$BACKUP_DIR"/users-*.json 2>/dev/null | tail -n +21 | xargs -r rm -f
