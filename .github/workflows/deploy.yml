name: Deploy Discord Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            BOT_DIR="/home/opc/sl-bot"
            cd "$BOT_DIR"

            DB_DIR="/home/opc/sl-bot-data"
            DB_FILE="$DB_DIR/users.json"
            BACKUP_DIR="$DB_DIR/backups"
            mkdir -p "$BACKUP_DIR"

            # The live database may still exist in the old Git checkout on the
            # first deployment after this migration. Copy it before pulling.
            if [ ! -f "$DB_FILE" ] && [ -f "$BOT_DIR/bot/users.json" ]; then
              cp "$BOT_DIR/bot/users.json" "$DB_FILE"
            fi

            if [ -f "$DB_FILE" ]; then
              cp "$DB_FILE" "$BACKUP_DIR/users-$(date +%Y%m%d-%H%M%S).json"
            fi

            # Remove local runtime changes from the old tracked database so
            # the deployment pull cannot be blocked by bot/users.json.
            git checkout -- bot/users.json 2>/dev/null || true
            git pull --ff-only origin main

            cd "$BOT_DIR/bot"
            npm install --omit=dev
            find . -type f -name '*.js' ! -name 'applications_legacy.js' -exec node --check {} \;

            cd "$BOT_DIR"
            test -f "$DB_FILE"
            SUPER_LEAGUE_DB_PATH="$DB_FILE" pm2 restart discord-bot --update-env
            pm2 describe discord-bot >/dev/null

            ls -1t "$BACKUP_DIR"/users-*.json 2>/dev/null | tail -n +21 | xargs -r rm -f
